[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audit-cli"
version = "0.1.0"
description = "Framework Audit Kesiapan Produksi API berbasis CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer[all]>=0.9",
    "httpx>=0.25",
    "pydantic>=2.0",
    "jsonschema>=4.20",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "pandas>=2.1",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "matplotlib>=3.7",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "mitmproxy>=10.0",
]

[project.scripts]
audit = "audit.cli:main"

[tool.setuptools.packages.find]
include = ["audit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
